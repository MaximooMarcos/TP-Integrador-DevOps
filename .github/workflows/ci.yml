name: CI/CD Pipeline - DevFlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # ETAPA 1: INTEGRACIÓN CONTINUA (CI)
  # -------------------------------------------------------------
  ci:
    name: CI / Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Run Linter (Ruff)
        run: ruff check .

      - name: Run Unit Tests (Pytest)
        run: python -m pytest 

  # -------------------------------------------------------------
  # ETAPA 2: ENTREGA CONTINUA (CD - Build & Push Docker)
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: ci # Solo se ejecuta si la etapa 'ci' pasa en verde
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devflow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devflow:v1.0.0

  # -------------------------------------------------------------
  # ETAPA 3: DESPLIEGUE CONTINUO (CD - Deploy to Render)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: build-and-push # Solo se ejecuta si la etapa de Docker pasa en verde
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"